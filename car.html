<header class="header" id="header">
  <a href="index.html#home" class="logo"><span class="logo-mark"></span>Bavaria Motors</a>
  <nav class="nav" id="nav">

    </ul>
  </nav>
  <div class="head-actions">
    <select class="hbtn hbtn-lang" id="lang" aria-label="Til / Language">
      <option value="uz">UZ</option><option value="ru">RU</option><option value="en">EN</option>
    </select>
    <button class="hbtn hbtn-theme" id="themeBtn" data-i18n-aria="themeAria"><svg class="ic" id="themeIcon"><use href="#i-sun"/></svg></button>
    <button class="hbtn hbtn-history" id="historyOpen"><svg class="ic"><use href="#i-clock"/></svg><span class="label" data-i18n="history">Tarix</span><span class="badge" id="historyCount">0</span></button>
    <button class="hbtn hbtn-cart" id="cartOpen"><svg class="ic"><use href="#i-cart"/></svg><span class="label" data-i18n="cart">Savat</span><span class="badge" id="cartCount">0</span></button>
    <button class="burger" id="burger" aria-label="Menu"><span></span><span></span><span></span></button>
  </div>
</header>

<main>
  <section class="section detail"><div class="wrap" id="detail"></div></section>
</main>

<footer class="footer">
  <div class="wrap">
    <div class="footer-grid">
      <div class="f-col">
        <a href="index.html#home" class="logo"><span class="logo-mark"></span>Bavaria Motors</a>
        <p data-i18n="fDesc"></p>
        <div class="socials"><a href="#" aria-label="Telegram">Tg</a><a href="#" aria-label="Instagram">Ig</a><a href="#" aria-label="Facebook">Fb</a><a href="#" aria-label="YouTube">Yt</a></div>
      </div>
      <div class="f-col">
        <h4 data-i18n="fPages"></h4>
        <ul>
          <li><a href="index.html#home" data-i18n="home"></a></li>
          <li><a href="index.html#about" data-i18n="about"></a></li>
          <li><a href="index.html#products" data-i18n="products"></a></li>
      <li><a href="index.html#calc" data-i18n="calcNav"></a></li>
          <li><a href="index.html#branches" data-i18n="branches"></a></li>
          <li><a href="index.html#contact" data-i18n="contact"></a></li>
        </ul>
      </div>
      <div class="f-col">
        <h4 data-i18n="fModels"></h4>
        <ul>
          <li><a href="index.html#products" data-i18n="Sedan"></a></li>
          <li><a href="index.html#products" data-i18n="Sport"></a></li>
          <li><a href="index.html#products" data-i18n="Elektr"></a></li>

      </div>
      <div class="f-col">
        <h4 data-i18n="fConnect"></h4>
        <ul class="f-contact">
          <li><svg class="ic"><use href="#i-pin"/></svg><span data-i18n="fAddr"></span></li>
          <li><svg class="ic"><use href="#i-phone"/></svg>+998 90 123 45 67</li>
          <li><svg class="ic"><use href="#i-mail"/></svg>info@bavariamotors.uz</li>
          <li><svg class="ic"><use href="#i-clock"/></svg><span data-i18n="cHoursV"></span></li>
        </ul>
      </div>
    </div>
    <p class="copy" data-i18n="copy"></p>
    <p class="copy credit" data-i18n="photoCredit"></p>

</footer>

<!-- Savat -->
<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-head"><h3 data-i18n="cartT"></h3><button class="close" id="cartClose" aria-label="Close">&times;</button></div>
  <div class="drawer-body" id="cartItems"></div>
  <div class="drawer-foot">
    <div class="total"><span data-i18n="total"></span><b id="cartTotal">$0</b></div>
    <button class="btn btn-green full" id="checkout"><svg class="ic"><use href="#i-card"/></svg><span data-i18n="checkout"></span></button>
    <button class="btn btn-red full" id="clearCart"><svg class="ic"><use href="#i-trash"/></svg><span data-i18n="clearCart"></span></button>
  </div>
</aside>

<!-- Tarix -->
<div class="modal" id="history">
  <div class="modal-box wide">
    <div class="drawer-head"><h3 data-i18n="histT"></h3><button class="close" id="historyClose" aria-label="Close">&times;</button></div>
    <div class="tabs">
      <button class="tab active" data-tab="mine" data-i18n="tabMine"></button>
      <button class="tab" data-tab="recent" data-i18n="tabRecent"></button>
    </div>
    <div class="tab-body" id="historyBody"></div>
    <div class="history-foot" id="historyFoot"></div>
  </div>
</div>

<!-- Xabar -->
<div class="modal" id="modal">
  <div class="modal-box">
    <div class="check"><svg class="ic"><use href="#i-check"/></svg></div>
    <h3 id="modalTitle"></h3>
    <p id="modalText"></p>
    <button class="btn btn-primary" id="modalClose" data-i18n="ok"></button>
  </div>
</div>

<!-- Jonli chat -->
<div class="chat" id="chat">
  <div class="chat-panel" id="chatPanel">
    <div class="chat-head">
      <span class="avatar"><svg class="ic"><use href="#i-users"/></svg></span>
      <div><b data-i18n="chatT"></b><small><i class="dot"></i><span data-i18n="chatOnline"></span></small></div>
      <button class="close" id="chatClose" aria-label="Close">&times;</button>
    </div>
    <div class="chat-body" id="chatBody"></div>
    <form class="chat-form" id="chatForm">
      <input type="text" id="chatInput" data-i18n-ph="chatPh" autocomplete="off">
      <button type="submit" class="send" aria-label="Send"><svg class="ic"><use href="#i-send"/></svg></button>
    </form>
  </div>
  <button class="chat-fab" id="chatFab" aria-label="Chat"><svg class="ic"><use href="#i-chat"/></svg><i class="ping"></i></button>
</div>

<div class="toast" id="toast"></div>
<script src="lang.js"></script>
<script src="lang2.js"></script>
<script src="data.js"></script>
<script src="script.js"></script>
<script src="car.js"></script>
</body>
</html>
